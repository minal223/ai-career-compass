<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Career Compass - Apex Trajectory</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Confetti Engine -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background-color: #0d0d0e;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    @keyframes radar-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-radar {
      animation: radar-spin 3s linear infinite;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TIER_COLORS = {
      Bronze: 'from-amber-700 to-amber-900 border-amber-600 text-amber-400',
      Silver: 'from-slate-400 to-slate-600 border-slate-300 text-slate-200',
      Gold: 'from-yellow-500 to-amber-600 border-yellow-400 text-yellow-300',
      Platinum: 'from-cyan-400 to-blue-600 border-cyan-300 text-cyan-200',
      Diamond: 'from-purple-400 to-indigo-600 border-purple-300 text-purple-200',
      Apex: 'from-yellow-300 via-amber-400 to-yellow-600 border-yellow-200 text-yellow-100'
    };

    const MOTIVATIONAL_QUOTES = [
      "Talent is common; relentless trajectory is rare.",
      "Your craft is your sanctuary. Refine it continuously.",
      "Architect your domain, or remain an inhabitant of others.",
      "Elegance in execution separates leaders from spectators."
    ];

    function App() {
      const [slide, setSlide] = useState(1);
      const [xp, setXp] = useState(200);
      const [level, setLevel] = useState(1);
      const [tier, setTier] = useState('Bronze');
      const [streak, setStreak] = useState(1);
      const [quoteIdx, setQuoteIdx] = useState(0);

      // Profile Intake State
      const [profile, setProfile] = useState({
        name: 'Minal',
        age: '16',
        gender: 'Prefer not to say',
        city: 'Lahore',
        country: 'Pakistan',
        education: 'Matric',
        skills: 'Python, Basic Math',
        interests: ['AI/ML', 'Software Architecture']
      });

      // Flow Control
      const [timelineMode, setTimelineMode] = useState('balanced');
      const [selectedCourse, setSelectedCourse] = useState(null);
      const [selectedAcademy, setSelectedAcademy] = useState(null);
      const [courseCompleted, setCourseCompleted] = useState(false);
      const [selectedJob, setSelectedJob] = useState(null);

      // Tools
      const [activeTab, setActiveTab] = useState('sandbox');
      const [sandboxCode, setSandboxCode] = useState('def main():\n    print("Hello Apex Trajectory")\n\nmain()');
      const [sandboxResult, setSandboxResult] = useState(null);
      const [chatMessages, setChatMessages] = useState([
        { sender: 'ai', text: 'Welcome to your learning chamber. Ask any question regarding your current coursework.' }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [isAiOpen, setIsAiOpen] = useState(false);

      useEffect(() => {
        const timer = setInterval(() => {
          setQuoteIdx(prev => (prev + 1) % MOTIVATIONAL_QUOTES.length);
        }, 4000);
        return () => clearInterval(timer);
      }, []);

      const addXp = (amount) => {
        const newXp = xp + amount;
        setXp(newXp);
        const newLevel = Math.floor(newXp / 500) + 1;
        
        if (newLevel > level) {
          setLevel(newLevel);
          if (window.confetti) {
            window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          }
          if (newLevel >= 50) setTier('Apex');
          else if (newLevel >= 30) setTier('Diamond');
          else if (newLevel >= 20) setTier('Platinum');
          else if (newLevel >= 10) setTier('Gold');
          else if (newLevel >= 5) setTier('Silver');
        }
      };

      const handleNextSlide = () => {
        addXp(100);
        setSlide(prev => Math.min(prev + 1, 9));
      };

      useEffect(() => {
        if (slide === 3) {
          const timer = setTimeout(() => setSlide(4), 3500);
          return () => clearTimeout(timer);
        }
      }, [slide]);

      return (
        <div className="min-h-screen bg-[#0d0d0e] text-gray-100 font-sans flex flex-col items-center justify-start pb-20 selection:bg-amber-500 selection:text-black">
          
          {/* Header */}
          <header className="w-full max-w-xl px-4 py-3 sticky top-0 z-50 bg-[#0d0d0e]/90 backdrop-blur-md border-b border-amber-900/20">
            <div className="flex items-center justify-between bg-[#161618] px-4 py-2 rounded-2xl border border-amber-500/20 shadow-lg shadow-black/50">
              <div className="flex items-center gap-2">
                <span className={`px-2.5 py-0.5 text-xs font-semibold rounded-full bg-gradient-to-r ${TIER_COLORS[tier]} border shadow-sm`}>
                  {tier}
                </span>
                <span className="text-xs font-bold tracking-wider text-amber-200/90">Level {level}</span>
              </div>

              <div className="flex-1 mx-4 max-w-[120px]">
                <div className="h-1.5 w-full bg-gray-800 rounded-full overflow-hidden">
                  <div 
                    className="h-full bg-gradient-to-r from-amber-500 to-yellow-300 transition-all duration-500"
                    style={{ width: `${(xp % 500) / 5}%` }}
                  />
                </div>
              </div>

              <div className="flex items-center gap-3 text-xs font-medium">
                <span className="text-amber-400/90 font-mono">{xp} XP</span>
                <span className="flex items-center gap-1 text-orange-400">🔥 {streak}d</span>
              </div>
            </div>

            <div className="flex items-center gap-1.5 overflow-x-auto py-2 no-scrollbar">
              {[
                '1 Welcome', '2 Intake', '3 Radar', '4 Courses', 
                '5 Academies', '6 Learning', '7 Jobs', '8 CV Studio', '9 Arena'
              ].map((label, idx) => (
                <button
                  key={idx}
                  onClick={() => setSlide(idx + 1)}
                  className={`px-3 py-1 rounded-full text-[11px] whitespace-nowrap transition-all duration-300 font-medium ${
                    slide === idx + 1 
                      ? 'bg-amber-500 text-black font-semibold shadow-md shadow-amber-500/20' 
                      : 'bg-zinc-900/80 text-zinc-400 hover:text-zinc-200 border border-zinc-800'
                  }`}
                >
                  {label}
                </button>
              ))}
            </div>
          </header>

          {/* Main Container */}
          <main className="w-full max-w-xl px-4 mt-2 flex-1">
            <div className="bg-[#141416] border border-amber-500/20 rounded-3xl p-6 min-h-[560px] flex flex-col justify-between shadow-2xl relative overflow-hidden backdrop-blur-xl">
              
              {/* SLIDE 1: WELCOME */}
              {slide === 1 && (
                <div className="flex-1 flex flex-col items-center justify-center text-center my-auto py-12">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs tracking-wider uppercase mb-6">
                    ✨ Zero to Hero
                  </div>

                  <h1 className="text-4xl sm:text-5xl font-serif text-amber-100 font-normal tracking-wide mb-6">
                    Ascend to the Apex
                  </h1>

                  <p className="text-base font-serif italic text-amber-200/60 max-w-md h-12 flex items-center justify-center transition-all duration-700">
                    "{MOTIVATIONAL_QUOTES[quoteIdx]}"
                  </p>

                  <button
                    onClick={handleNextSlide}
                    className="mt-10 px-8 py-3.5 rounded-full bg-gradient-to-r from-amber-400 via-amber-500 to-yellow-600 text-black font-semibold text-sm shadow-xl shadow-amber-500/20 hover:shadow-amber-500/40 hover:scale-[1.02] transition-all duration-300"
                  >
                    Begin Your Ascent
                  </button>
                </div>
              )}

              {/* SLIDE 2: INTAKE */}
              {slide === 2 && (
                <div className="flex-1 flex flex-col">
                  <h2 className="text-2xl font-serif text-amber-100 mb-6">Tell us where you stand</h2>
                  
                  <div className="space-y-4 text-xs font-medium flex-1">
                    <div>
                      <label className="text-zinc-400 mb-1 block">Name</label>
                      <input
                        type="text"
                        value={profile.name}
                        onChange={e => setProfile({...profile, name: e.target.value})}
                        className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-zinc-100 focus:border-amber-500 outline-none"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-zinc-400 mb-1 block">Age</label>
                        <input
                          type="number"
                          value={profile.age}
                          onChange={e => setProfile({...profile, age: e.target.value})}
                          className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-zinc-100 focus:border-amber-500 outline-none"
                        />
                      </div>
                      <div>
                        <label className="text-zinc-400 mb-1 block">Gender</label>
                        <select
                          value={profile.gender}
                          onChange={e => setProfile({...profile, gender: e.target.value})}
                          className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-zinc-100 focus:border-amber-500 outline-none"
                        >
                          <option>Male</option>
                          <option>Female</option>
                          <option>Prefer not to say</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-zinc-400 mb-1 block">City</label>
                        <input
                          type="text"
                          value={profile.city}
                          onChange={e => setProfile({...profile, city: e.target.value})}
                          className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-zinc-100 focus:border-amber-500 outline-none"
                        />
                      </div>
                      <div>
                        <label className="text-zinc-400 mb-1 block">Country</label>
                        <input
                          type="text"
                          value={profile.country}
                          onChange={e => setProfile({...profile, country: e.target.value})}
                          className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-zinc-100 focus:border-amber-500 outline-none"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-zinc-400 mb-1 block">Education</label>
                      <input
                        type="text"
                        value={profile.education}
                        onChange={e => setProfile({...profile, education: e.target.value})}
                        className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-zinc-100 focus:border-amber-500 outline-none"
                      />
                    </div>

                    <div>
                      <label className="text-zinc-400 mb-1 block">Current skills (comma separated)</label>
                      <input
                        type="text"
                        value={profile.skills}
                        onChange={e => setProfile({...profile, skills: e.target.value})}
                        className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-zinc-100 focus:border-amber-500 outline-none"
                      />
                    </div>

                    <div>
                      <label className="text-zinc-400 mb-2 block">Interests</label>
                      <div className="flex flex-wrap gap-2">
                        {['AI/ML', 'Software Architecture', 'Data Science', 'UX Design', 'Business Analytics'].map(interest => {
                          const isSelected = profile.interests.includes(interest);
                          return (
                            <button
                              key={interest}
                              type="button"
                              onClick={() => {
                                if (isSelected) {
                                  setProfile({...profile, interests: profile.interests.filter(i => i !== interest)});
                                } else {
                                  setProfile({...profile, interests: [...profile.interests, interest]});
                                }
                              }}
                              className={`px-3 py-1.5 rounded-full text-xs font-medium transition-all ${
                                isSelected 
                                  ? 'bg-amber-500 text-black border border-amber-400' 
                                  : 'bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700'
                              }`}
                            >
                              {interest}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                  <button
                    onClick={() => setSlide(3)}
                    className="mt-6 w-full py-3 rounded-2xl bg-amber-500 text-black font-semibold text-sm shadow-lg shadow-amber-500/20 hover:bg-amber-400 transition-all"
                  >
                    Construct Roadmap
                  </button>
                </div>
              )}

              {/* SLIDE 3: RADAR */}
              {slide === 3 && (
                <div className="flex-1 flex flex-col items-center justify-center text-center py-16">
                  <h2 className="text-2xl font-serif text-amber-100 mb-10">Building your roadmap...</h2>

                  <div className="relative w-44 h-44 flex items-center justify-center mb-10">
                    <div className="absolute inset-0 rounded-full border border-amber-500/20" />
                    <div className="absolute inset-4 rounded-full border border-amber-500/30" />
                    <div className="absolute inset-8 rounded-full border border-amber-500/40" />
                    <div className="w-full h-full rounded-full animate-radar bg-[conic-gradient(from_0deg,transparent_0_300deg,rgba(234,179,8,0.4)_360deg)]" />
                    <div className="w-3 h-3 bg-amber-400 rounded-full shadow-lg shadow-amber-400/80 z-10" />
                  </div>

                  <p className="text-sm font-serif italic text-amber-200/70">
                    Cross-referencing skills, market and prerequisites...
                  </p>
                </div>
              )}

              {/* SLIDE 4: COURSES */}
              {slide === 4 && (
                <div className="flex-1 flex flex-col">
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="text-xl font-serif text-amber-100">Recommended Curriculums</h2>
                    <div className="flex bg-zinc-900 p-1 rounded-xl border border-zinc-800 text-xs">
                      <button
                        onClick={() => setTimelineMode('fast')}
                        className={`px-2.5 py-1 rounded-lg transition-all ${timelineMode === 'fast' ? 'bg-amber-500 text-black font-semibold' : 'text-zinc-400'}`}
                      >
                        Fast
                      </button>
                      <button
                        onClick={() => setTimelineMode('balanced')}
                        className={`px-2.5 py-1 rounded-lg transition-all ${timelineMode === 'balanced' ? 'bg-amber-500 text-black font-semibold' : 'text-zinc-400'}`}
                      >
                        Balanced
                      </button>
                    </div>
                  </div>

                  <div className="space-y-3 flex-1 overflow-y-auto pr-1">
                    {[
                      {
                        id: 'ai-arch',
                        title: 'Apex AI Architecture',
                        duration: timelineMode === 'fast' ? '8 Weeks' : '16 Weeks',
                        hours: timelineMode === 'fast' ? '25 hrs/wk' : '12 hrs/wk',
                        level: 'Advanced',
                        gap: 'Python Skill Gap: +35%',
                        description: 'Master Deep Learning, LLM Fine-tuning, & Autonomous AI Agents.'
                      },
                      {
                        id: 'fullstack',
                        title: 'Full-Stack Autonomous Systems',
                        duration: timelineMode === 'fast' ? '10 Weeks' : '20 Weeks',
                        hours: timelineMode === 'fast' ? '30 hrs/wk' : '15 hrs/wk',
                        level: 'Intermediate',
                        gap: 'Web Core Skill Gap: +15%',
                        description: 'Build enterprise Next.js applications powered by Cloud Microservices.'
                      }
                    ].map(course => (
                      <div
                        key={course.id}
                        onClick={() => setSelectedCourse(course)}
                        className={`p-4 rounded-2xl border transition-all cursor-pointer ${
                          selectedCourse?.id === course.id
                            ? 'border-amber-500 bg-amber-500/10'
                            : 'border-zinc-800 bg-zinc-900/60 hover:border-zinc-700'
                        }`}
                      >
                        <div className="flex justify-between items-start mb-2">
                          <h3 className="font-serif text-base text-amber-200">{course.title}</h3>
                          <span className="text-[10px] px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 font-mono">
                            {course.level}
                          </span>
                        </div>

                        <p className="text-xs text-zinc-400 mb-3">{course.description}</p>

                        <div className="flex items-center justify-between text-[11px] text-zinc-400 border-t border-zinc-800/80 pt-2">
                          <span>⏱ {course.duration} ({course.hours})</span>
                          <span className="text-amber-400/90 font-mono">{course.gap}</span>
                        </div>
                      </div>
                    ))}
                  </div>

                  <button
                    disabled={!selectedCourse}
                    onClick={() => setSlide(5)}
                    className={`mt-4 w-full py-3 rounded-2xl text-sm font-semibold transition-all ${
                      selectedCourse 
                        ? 'bg-amber-500 text-black shadow-lg shadow-amber-500/20 hover:bg-amber-400' 
                        : 'bg-zinc-800 text-zinc-500 cursor-not-allowed'
                    }`}
                  >
                    Find Academies in {profile.city}
                  </button>
                </div>
              )}

              {/* SLIDE 5: ACADEMIES */}
              {slide === 5 && (
                <div className="flex-1 flex flex-col">
                  <h2 className="text-xl font-serif text-amber-100 mb-3">Verified Academies in {profile.city}</h2>

                  <div className="w-full h-36 bg-zinc-900 rounded-2xl border border-zinc-800 relative overflow-hidden mb-4 flex items-center justify-center">
                    <div className="absolute inset-0 bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:16px_16px] opacity-30" />
                    <div className="flex items-center gap-2 bg-black/70 backdrop-blur-md px-3 py-1.5 rounded-full border border-amber-500/30 text-xs text-amber-300 z-10">
                      📍 Map view active for {profile.city}
                    </div>
                  </div>

                  <div className="space-y-3 flex-1 overflow-y-auto pr-1">
                    {[
                      {
                        id: 'acad-1',
                        name: `Apex Institute of Tech - ${profile.city}`,
                        rating: '4.9 ⭐',
                        fees: '$1,200',
                        distance: '2.4 km away',
                        contact: '+92 42 35789000'
                      },
                      {
                        id: 'acad-2',
                        name: `Global AI Academy (${profile.city} Campus)`,
                        rating: '4.8 ⭐',
                        fees: '$950',
                        distance: '4.1 km away',
                        contact: '+92 42 35112233'
                      },
                      {
                        id: 'acad-3',
                        name: 'Apex Online Virtual Campus (Fallback)',
                        rating: '5.0 ⭐',
                        fees: '$790',
                        distance: '100% Online',
                        contact: 'admissions@apex-online.edu'
                      }
                    ].map(acad => (
                      <div
                        key={acad.id}
                        onClick={() => setSelectedAcademy(acad)}
                        className={`p-3.5 rounded-2xl border transition-all cursor-pointer ${
                          selectedAcademy?.id === acad.id
                            ? 'border-amber-500 bg-amber-500/10'
                            : 'border-zinc-800 bg-zinc-900/60 hover:border-zinc-700'
                        }`}
                      >
                        <div className="flex justify-between items-start mb-1">
                          <h4 className="font-serif text-sm text-amber-200">{acad.name}</h4>
                          <span className="text-xs font-semibold text-amber-400">{acad.rating}</span>
                        </div>

                        <p className="text-xs text-zinc-400 mb-2">Distance: {acad.distance} • Fees: {acad.fees}</p>

                        <div className="text-[11px] text-zinc-500 flex justify-between items-center">
                          <span>📞 {acad.contact}</span>
                          {selectedAcademy?.id === acad.id && (
                            <span className="text-amber-400 font-semibold">Selected</span>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>

                  <button
                    disabled={!selectedAcademy}
                    onClick={() => setSlide(6)}
                    className={`mt-4 w-full py-3 rounded-2xl text-sm font-semibold transition-all ${
                      selectedAcademy 
                        ? 'bg-amber-500 text-black shadow-lg shadow-amber-500/20 hover:bg-amber-400' 
                        : 'bg-zinc-800 text-zinc-500 cursor-not-allowed'
                    }`}
                  >
                    Enroll & Enter Learning Hub
                  </button>
                </div>
              )}

              {/* SLIDE 6: LEARNING HUB */}
              {slide === 6 && (
                <div className="flex-1 flex flex-col">
                  <div className="flex items-center justify-between mb-4 border-b border-zinc-800 pb-3">
                    <h2 className="text-xl font-serif text-amber-100">Learning Hub</h2>
                    <button
                      onClick={() => {
                        setCourseCompleted(true);
                        addXp(300);
                      }}
                      className={`text-xs px-3 py-1 rounded-full font-semibold transition-all ${
                        courseCompleted 
                          ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' 
                          : 'bg-amber-500/20 text-amber-300 border border-amber-500/30 hover:bg-amber-500/30'
                      }`}
                    >
                      {courseCompleted ? '✓ Course Completed' : 'Simulate Completion'}
                    </button>
                  </div>

                  <div className="flex gap-2 mb-4 bg-zinc-900 p-1 rounded-xl border border-zinc-800 text-xs">
                    <button
                      onClick={() => setActiveTab('sandbox')}
                      className={`flex-1 py-1.5 rounded-lg transition-all ${activeTab === 'sandbox' ? 'bg-amber-500 text-black font-semibold' : 'text-zinc-400'}`}
                    >
                      💻 Code Sandbox
                    </button>
                    <button
                      onClick={() => setActiveTab('linkedin')}
                      className={`flex-1 py-1.5 rounded-lg transition-all ${activeTab === 'linkedin' ? 'bg-amber-500 text-black font-semibold' : 'text-zinc-400'}`}
                    >
                      📂 LinkedIn Audit
                    </button>
                  </div>

                  {activeTab === 'sandbox' && (
                    <div className="flex-1 flex flex-col space-y-3">
                      <div className="text-xs text-zinc-400 flex items-center justify-between">
                        <span>Task: Write a Python function for Apex Trajectory</span>
                        <span className="text-amber-400 font-mono">+50 XP</span>
                      </div>

                      <textarea
                        value={sandboxCode}
                        onChange={e => setSandboxCode(e.target.value)}
                        className="w-full flex-1 min-h-[140px] bg-zinc-950 font-mono text-xs text-green-400 border border-zinc-800 rounded-xl p-3 focus:border-amber-500 outline-none"
                      />

                      <button
                        onClick={() => {
                          setSandboxResult({ score: '98/100', tips: 'Excellent modular structure. Memory allocation is optimal.' });
                          addXp(50);
                        }}
                        className="w-full py-2.5 bg-zinc-800 hover:bg-zinc-700 text-amber-200 text-xs font-semibold rounded-xl border border-zinc-700 transition-all"
                      >
                        ▶ Evaluate Code
                      </button>

                      {sandboxResult && (
                        <div className="p-3 bg-zinc-900/80 border border-emerald-500/30 rounded-xl text-xs space-y-1">
                          <p className="text-emerald-400 font-semibold">Evaluation Score: {sandboxResult.score}</p>
                          <p className="text-zinc-400">{sandboxResult.tips}</p>
                        </div>
                      )}
                    </div>
                  )}

                  {activeTab === 'linkedin' && (
                    <div className="flex-1 flex flex-col space-y-3">
                      <div className="p-4 border border-dashed border-zinc-700 rounded-xl bg-zinc-900/40 text-center flex flex-col items-center justify-center space-y-2">
                        <span className="text-2xl">📤</span>
                        <p className="text-xs text-zinc-300">Upload LinkedIn Profile Screenshot</p>
                        <span className="text-[10px] text-zinc-500">AI pinpoints weak summaries & headlines</span>
                      </div>

                      <div className="p-3 bg-zinc-900 border border-amber-500/20 rounded-xl space-y-2 text-xs">
                        <p className="text-amber-300 font-serif">Suggested Rewrite:</p>
                        <p className="text-zinc-300 font-mono bg-zinc-950 p-2 rounded border border-zinc-800 text-[11px]">
                          "Aspiring AI Systems Architect | Python & Deep Learning Enthusiast | Building Next-Gen Trajectories"
                        </p>
                      </div>
                    </div>
                  )}

                  <button
                    disabled={!courseCompleted}
                    onClick={() => setSlide(7)}
                    className={`mt-4 w-full py-3 rounded-2xl text-sm font-semibold transition-all ${
                      courseCompleted 
                        ? 'bg-amber-500 text-black shadow-lg shadow-amber-500/20 hover:bg-amber-400' 
                        : 'bg-zinc-800 text-zinc-500 cursor-not-allowed'
                    }`}
                  >
                    {courseCompleted ? 'Unlock Job Hunter' : 'Complete Course to Unlock Jobs'}
                  </button>
                </div>
              )}

              {/* SLIDE 7: JOB HUNTER */}
              {slide === 7 && (
                <div className="flex-1 flex flex-col">
                  <h2 className="text-xl font-serif text-amber-100 mb-3">Matched Vacancies ({profile.city} & Remote)</h2>

                  <div className="space-y-3 flex-1 overflow-y-auto pr-1">
                    {[
                      {
                        id: 'job-1',
                        title: 'Junior AI Engineer',
                        company: 'Apex Systems',
                        location: `${profile.city} (On-Site)`,
                        email: 'recruiting@apexsystems.com',
                        salary: '$45,000 - $60,000'
                      },
                      {
                        id: 'job-2',
                        title: 'Autonomous Systems Trainee',
                        company: 'Global Tech Corp',
                        location: 'Remote',
                        email: 'careers@globaltech.io',
                        salary: '$50,000 - $70,000'
                      }
                    ].map(job => (
                      <div
                        key={job.id}
                        onClick={() => setSelectedJob(job)}
                        className={`p-3.5 rounded-2xl border transition-all cursor-pointer ${
                          selectedJob?.id === job.id
                            ? 'border-amber-500 bg-amber-500/10'
                            : 'border-zinc-800 bg-zinc-900/60 hover:border-zinc-700'
                        }`}
                      >
                        <div className="flex justify-between items-start mb-1">
                          <h4 className="font-serif text-sm text-amber-200">{job.title}</h4>
                          <span className="text-xs font-mono text-emerald-400">{job.salary}</span>
                        </div>

                        <p className="text-xs text-zinc-400 mb-2">{job.company} • {job.location}</p>
                        <p className="text-[11px] text-zinc-500">Recruiter: {job.email}</p>
                      </div>
                    ))}
                  </div>

                  {selectedJob && (
                    <div className="mt-3 p-3 bg-zinc-900 border border-amber-500/30 rounded-xl text-xs space-y-1">
                      <p className="text-amber-300 font-serif">AI Cold Email Strategy for {selectedJob.title}:</p>
                      <p className="text-zinc-400 italic text-[11px]">Subject: Application for {selectedJob.title} - {profile.name}</p>
                      <p className="text-zinc-300 text-[11px]">"Dear Hiring Team, I recently completed my AI Architecture curriculum with high honors in Python..."</p>
                    </div>
                  )}

                  <button
                    disabled={!selectedJob}
                    onClick={() => setSlide(8)}
                    className={`mt-4 w-full py-3 rounded-2xl text-sm font-semibold transition-all ${
                      selectedJob 
                        ? 'bg-amber-500 text-black shadow-lg shadow-amber-500/20 hover:bg-amber-400' 
                        : 'bg-zinc-800 text-zinc-500 cursor-not-allowed'
                    }`}
                  >
                    Build Tailored ATS CV
                  </button>
                </div>
              )}

              {/* SLIDE 8: CV STUDIO */}
              {slide === 8 && (
                <div className="flex-1 flex flex-col">
                  <h2 className="text-xl font-serif text-amber-100 mb-3">ATS-Optimized Luxury CV</h2>

                  <div className="flex-1 bg-zinc-950 p-5 rounded-2xl border border-zinc-800 space-y-4 overflow-y-auto text-xs font-serif">
                    <div className="border-b border-zinc-800 pb-3 text-center">
                      <h3 className="text-xl text-amber-200 font-normal">{profile.name}</h3>
                      <p className="text-zinc-400 font-sans text-[11px] mt-1">{profile.city}, {profile.country} | {profile.education}</p>
                    </div>

                    <div>
                      <h4 className="text-amber-400 text-xs font-semibold uppercase tracking-wider mb-1 font-sans">Professional Summary</h4>
                      <p className="text-zinc-300 font-sans leading-relaxed text-[11px]">
                        Driven candidate with structured coursework in {selectedCourse?.title || 'AI & Software Architecture'}. Skilled in {profile.skills}.
                      </p>
                    </div>

                    <div>
                      <h4 className="text-amber-400 text-xs font-semibold uppercase tracking-wider mb-1 font-sans">Key Competencies</h4>
                      <p className="text-zinc-300 font-sans text-[11px]">
                        {profile.interests.join(' • ')} • Code Evaluation Score 98%
                      </p>
                    </div>
                  </div>

                  <div className="flex gap-2 mt-4">
                    <button
                      onClick={() => alert("CV PDF exported successfully!")}
                      className="flex-1 py-3 rounded-2xl bg-zinc-800 hover:bg-zinc-700 text-amber-200 text-xs font-semibold border border-zinc-700 transition-all flex items-center justify-center gap-2"
                    >
                      📄 Export PDF
                    </button>
                    <button
                      onClick={() => setSlide(9)}
                      className="flex-1 py-3 rounded-2xl bg-amber-500 hover:bg-amber-400 text-black text-xs font-semibold transition-all shadow-lg shadow-amber-500/20"
                    >
                      Enter Interview Arena
                    </button>
                  </div>
                </div>
              )}

              {/* SLIDE 9: INTERVIEW ARENA */}
              {slide === 9 && (
                <div className="flex-1 flex flex-col">
                  <h2 className="text-xl font-serif text-amber-100 mb-3">AI Interview Arena</h2>

                  <div className="w-full h-44 bg-zinc-950 rounded-2xl border border-amber-500/30 relative overflow-hidden mb-3 flex flex-col items-center justify-center">
                    <span className="text-3xl mb-2 animate-pulse">📷</span>
                    <span className="text-xs text-zinc-400 font-mono">Live Camera Feed Active</span>
                    
                    <div className="absolute top-2 right-2 bg-black/80 border border-emerald-500/40 text-emerald-400 text-[10px] px-2.5 py-1 rounded-full">
                      Posture: Optimal | Pace: Steady
                    </div>
                  </div>

                  <div className="p-3 bg-zinc-900 border border-zinc-800 rounded-xl space-y-2 mb-3">
                    <p className="text-amber-300 font-serif text-xs">AI Interviewer Question:</p>
                    <p className="text-zinc-200 text-xs">
                      "Tell me about a challenging technical problem you solved using {profile.skills.split(',')[0] || 'Python'}."
                    </p>
                  </div>

                  <div className="flex items-center justify-center py-2">
                    <button
                      onClick={() => addXp(100)}
                      className="w-12 h-12 rounded-full bg-amber-500/20 border border-amber-500 text-amber-400 flex items-center justify-center hover:scale-105 transition-all text-xl"
                    >
                      🎙️
                    </button>
                  </div>

                  <div className="mt-auto p-3 bg-zinc-900/60 border border-zinc-800 rounded-xl text-[11px] grid grid-cols-2 gap-2 text-zinc-300">
                    <div>STAR Structure: <span className="text-amber-400 font-bold">9/10</span></div>
                    <div>Content Depth: <span className="text-amber-400 font-bold">8.5/10</span></div>
                    <div>Voice Delivery: <span className="text-amber-400 font-bold">9/10</span></div>
                    <div>Body Posture: <span className="text-amber-400 font-bold">9.5/10</span></div>
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* AI Tutor Floating Drawer Button */}
          <button
            onClick={() => setIsAiOpen(!isAiOpen)}
            className="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-gradient-to-r from-amber-400 to-yellow-600 text-black shadow-xl shadow-amber-500/30 flex items-center justify-center hover:scale-110 transition-all z-50 text-xl font-bold"
          >
            🤖
          </button>

          {/* AI Tutor Drawer */}
          {isAiOpen && (
            <div className="fixed bottom-24 right-6 w-80 bg-[#161618] border border-amber-500/30 rounded-2xl shadow-2xl z-50 overflow-hidden flex flex-col h-96">
              <div className="p-3 bg-zinc-900 border-b border-zinc-800 flex items-center justify-between text-xs font-serif text-amber-200">
                <span className="flex items-center gap-2">🤖 Apex AI Tutor</span>
                <button onClick={() => setIsAiOpen(false)}>✕</button>
              </div>

              <div className="flex-1 p-3 overflow-y-auto space-y-2 text-xs">
                {chatMessages.map((msg, i) => (
                  <div key={i} className={`p-2.5 rounded-xl ${msg.sender === 'ai' ? 'bg-zinc-900 border border-zinc-800 text-zinc-200' : 'bg-amber-500 text-black font-medium ml-auto max-w-[80%]'}`}>
                    {msg.text}
                  </div>
                ))}
              </div>

              <div className="p-2 border-t border-zinc-800 flex gap-2">
                <input
                  type="text"
                  placeholder="Ask AI tutor..."
                  value={chatInput}
                  onChange={e => setChatInput(e.target.value)}
                  onKeyDown={e => {
                    if (e.key === 'Enter' && chatInput.trim()) {
                      setChatMessages([...chatMessages, { sender: 'user', text: chatInput }, { sender: 'ai', text: 'I am here to guide you step-by-step through this lesson.' }]);
                      setChatInput('');
                    }
                  }}
                  className="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-1.5 text-xs text-zinc-100 outline-none focus:border-amber-500"
                />
                <button 
                  onClick={() => {
                    if (chatInput.trim()) {
                      setChatMessages([...chatMessages, { sender: 'user', text: chatInput }, { sender: 'ai', text: 'I am here to guide you step-by-step through this lesson.' }]);
                      setChatInput('');
                    }
                  }}
                  className="p-2 bg-amber-500 text-black rounded-xl font-bold"
                >
                  ➔
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
