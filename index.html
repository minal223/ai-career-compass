<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Career Compass - Apex Platform</title>

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#F59E0B',
              emerald: '#10B981',
              darkBg: '#090A0F',
              cardBg: '#12141D',
              border: '#232736'
            }
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090A0F; color: #E2E8F0; }
    .font-serif { font-family: 'Playfair Display', serif; }
    .glow-gold { box-shadow: 0 0 20px rgba(245, 158, 11, 0.2); }
    .glow-emerald { box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function AICareerCompass() {
      // USER PROFILE & INTAKE STATE
      const [currentUser, setCurrentUser] = useState({
        name: "Minal",
        age: "16",
        city: "Lahore",
        country: "Pakistan",
        education: "Matriculation / Self-Study",
        skills: "Python, JavaScript, Machine Learning, HTML/CSS",
        interests: "AI Development, Web Architecture, Data Science",
        targetRole: "Full-Stack AI Engineer"
      });

      const [showIntake, setShowIntake] = useState(false);
      const [intakeStep, setIntakeStep] = useState(3);
      const [activeTab, setActiveTab] = useState('overview');

      // SLIDE 4 REAL ACADEMIES DATABASE
      const academyData = {
        "Lahore": [
          { name: "PNY Trainings Lahore", location: "Arfa Software Technology Park, Ferozepur Road", mapUrl: "https://www.google.com/maps/search/PNY+Trainings+Arfa+Software+Technology+Park+Lahore", phone: "+92 304 1111774", course: "AI & Full-Stack Development" },
          { name: "ITU Training Center", location: "Arfa Software Tech Park, Level 3", mapUrl: "https://www.google.com/maps/search/Information+Technology+University+Lahore", phone: "+92 42 111 111 488", course: "Data Science & Machine Learning" },
          { name: "CORVIT Systems Lahore", location: "7-A, College Block, Gulberg III", mapUrl: "https://www.google.com/maps/search/Corvit+Systems+Gulberg+Lahore", phone: "+92 42 35755502", course: "Python & Cloud Engineering" }
        ],
        "Karachi": [
          { name: "Saylani Mass IT Training (SMIT)", location: "Bahadurabad, Karachi", mapUrl: "https://www.google.com/maps/search/Saylani+Mass+IT+Training+Karachi", phone: "+92 21 111 729 526", course: "Web & Mobile App Dev" },
          { name: "Aptech Computer Education", location: "Saddar / Gulshan-e-Iqbal, Karachi", mapUrl: "https://www.google.com/maps/search/Aptech+Computer+Education+Karachi", phone: "+92 21 34980553", course: "Full Stack Software Engineering" }
        ],
        "Islamabad": [
          { name: "NASTP Institute of Emerging Technologies", location: "Alpha Techno City, Rawalpindi/Islamabad", mapUrl: "https://www.google.com/maps/search/NASTP+Islamabad", phone: "+92 51 99280000", course: "Artificial Intelligence & Robotics" }
        ]
      };

      // AI TUTOR & YOUTUBE STATE
      const [tutorMessages, setTutorMessages] = useState([
        { sender: 'bot', text: 'Welcome! I am your AI Master Tutor. Ask me any technical question on AI, DL, ML, Python, or Full-Stack Architecture.' }
      ]);
      const [tutorInput, setTutorInput] = useState('');
      const [ytUrl, setYtUrl] = useState('');
      const [ytSummary, setYtSummary] = useState(null);

      // INTERVIEW ARENA VOICE STATE
      const videoRef = useRef(null);
      const [cameraActive, setCameraActive] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [interviewStarted, setInterviewStarted] = useState(false);
      const [userTranscript, setUserTranscript] = useState('');
      const [interviewFeedback, setInterviewerFeedback] = useState("Camera and Audio stream offline. Enable permissions to begin live mock evaluation.");
      const [recognitionInstance, setRecognitionInstance] = useState(null);

      // CV STUDIO EXPANDED STATE
      const [cvData, setCvData] = useState({
        fullName: "Minal",
        email: "minal@example.com",
        phone: "+92 300 1234567",
        city: "Lahore",
        country: "Pakistan",
        title: "Full-Stack AI Engineer",
        experience: "Engineered scalable React & Python applications integrated with machine learning models and REST APIs.",
        projects: "AI Career Compass Platform, E-Commerce Engine, Neural Network Classifier",
        skills: "Python, JavaScript, React, PyTorch, Node.js, SQL, TailWind CSS",
        certifications: "Matriculation Self-Study, Intermediate CS Pathway"
      });

      // LINKEDIN AUDIT STATE
      const [linkedinUrl, setLinkedinUrl] = useState('');
      const [linkedinText, setLinkedinText] = useState('');
      const [linkedinResult, setLinkedinResult] = useState(null);

      // SANDBOX ENGINE
      const [sandboxCode, setSandboxCode] = useState("// JavaScript Execution Engine\nfunction evaluateSkillGrowth(years, rate) {\n  let skillLevel = 100;\n  for(let i=1; i<=years; i++) {\n    skillLevel += skillLevel * (rate / 100);\n  }\n  return `Projected competency after ${years} years: ${skillLevel.toFixed(0)} points`;\n}\n\nconsole.log(evaluateSkillGrowth(3, 30));");
      const [sandboxOutput, setSandboxOutput] = useState("");

      // SPEECH SYNTHESIS ENGINE
      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 0.95;
          utterance.pitch = 1.0;
          window.speechSynthesis.speak(utterance);
        }
      };

      // INITIALIZE VOICE RECOGNITION (MIC)
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          const rec = new SpeechRecognition();
          rec.continuous = true;
          rec.interimResults = true;
          rec.lang = 'en-US';

          rec.onresult = (event) => {
            let current = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              current += event.results[i][0].transcript;
            }
            setUserTranscript(current);
          };

          rec.onerror = (err) => console.error("Speech Recognition Error:", err);
          setRecognitionInstance(rec);
        }
      }, []);

      const toggleListening = () => {
        if (!recognitionInstance) {
          alert("Speech Recognition API is not supported on this browser.");
          return;
        }
        if (isListening) {
          recognitionInstance.stop();
          setIsListening(false);
        } else {
          setUserTranscript('');
          recognitionInstance.start();
          setIsListening(true);
        }
      };

      // CAMERA & MIC START
      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          if (videoRef.current) videoRef.current.srcObject = stream;
          setCameraActive(true);
          setInterviewerFeedback("Audio/Video feed online. Click 'Start AI Interview' to receive your first live voice question.");
        } catch (err) {
          setInterviewerFeedback("Media Device Notice: " + err.message);
        }
      };

      const startInterview = () => {
        setInterviewStarted(true);
        const question = `Hello ${currentUser.name}! I am your AI Technical Recruiter. Based on your profile in ${currentUser.city}, describe a complex technical problem you solved using ${currentUser.skills.split(',')[0] || 'Python'}.`;
        setInterviewerFeedback(question);
        speakText(question);
      };

      const submitVoiceAnswer = () => {
        if (isListening && recognitionInstance) {
          recognitionInstance.stop();
          setIsListening(false);
        }
        const answerText = userTranscript || "The candidate provided an answer covering architecture and implementation details.";
        const evaluation = `AI Recruiter Assessment of response: "${answerText}"\n\n- Clarity & Tone: 88/100\n- Technical Context: Solid references to problem solving.\n\nNext Question: How do you optimize dynamic algorithms when handling large scale dataset updates?`;
        setInterviewerFeedback(evaluation);
        setUserTranscript('');
        speakText("Good response. Now, how do you optimize dynamic algorithms when handling large scale dataset updates?");
      };

      // SANDBOX RUNNER
      const runSandboxCode = () => {
        let logs = [];
        const customConsole = {
          log: (...args) => logs.push(args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ')),
          error: (...args) => logs.push("ERROR: " + args.join(' '))
        };
        try {
          const runFn = new Function('console', sandboxCode);
          runFn(customConsole);
          setSandboxOutput(logs.join('\n') || "Code executed successfully with no output.");
        } catch (err) {
          setSandboxOutput("Runtime Exception: " + err.message);
        }
      };

      // AI TUTOR HANDLER
      const handleTutorSend = () => {
        if (!tutorInput.trim()) return;
        const q = tutorInput;
        setTutorMessages(prev => [...prev, { sender: 'user', text: q }]);
        setTutorInput('');

        setTimeout(() => {
          let ans = "";
          const lower = q.toLowerCase();
          if (lower.includes("ml") || lower.includes("machine learning")) {
            ans = "Machine Learning involves building mathematical algorithms (Regression, Decision Trees, SVMs) that extract patterns from data to generalize on unobserved data points.";
          } else if (lower.includes("dl") || lower.includes("deep learning")) {
            ans = "Deep Learning uses multi-layered Neural Networks (CNNs, Transformers, RNNs) capable of learning hierarchical feature representations directly from unstructured data.";
          } else if (lower.includes("python")) {
            ans = "Python is the primary standard for AI due to memory-efficient libraries like NumPy, PyTorch, Pandas, and Scikit-Learn.";
          } else {
            ans = `Regarding "${q}": Success in this domain relies on clear data preprocessing, choosing the right framework, and conducting rigorous unit testing.`;
          }
          setTutorMessages(prev => [...prev, { sender: 'bot', text: ans }]);
          speakText(ans);
        }, 300);
      };

      // YOUTUBE CONVERTER
      const handleYtConvert = () => {
        if (!ytUrl.trim()) return;
        setYtSummary({
          title: "Converted Lesson: Full-Stack & Machine Learning Core Architecture",
          keyPoints: [
            "1. Core setup and repository initialization",
            "2. Modular API layer construction & model binding",
            "3. Production optimization, deployment, and performance monitoring"
          ],
          translation: "Translated Note: High-yield concepts extracted for rapid review."
        });
      };

      // LINKEDIN AUDIT
      const runLinkedinAudit = () => {
        if (!linkedinUrl.trim() && !linkedinText.trim()) return;
        setLinkedinResult({
          score: 87,
          headlineRating: "92/100 (Strong target keyword alignment)",
          missingKeywords: ["PyTorch", "System Design", "Cloud Infrastructure"],
          actionSteps: [
            "Quantify role achievements (e.g., 'Engineered 5+ web applications with 99% uptime').",
            "Incorporate target keywords into your About section for recruiter search visibility.",
            "Request recommendations from project collaborators to strengthen credential validity."
          ]
        });
      };

      const cityAcademies = academyData[currentUser.city] || academyData["Lahore"];

      return (
        <div className="min-h-screen flex flex-col bg-[#090A0F] text-[#E2E8F0]">
          {/* HEADER */}
          <header className="border-b border-[#232736] bg-[#12141D] px-6 py-4 flex justify-between items-center sticky top-0 z-50">
            <div className="flex items-center gap-3">
              <span className="font-serif text-2xl tracking-wider text-[#F59E0B] font-bold">
                AI CAREER COMPASS
              </span>
              <span className="hidden md:inline bg-[#10B981]/10 text-[#10B981] border border-[#10B981]/30 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase">
                Apex Grade
              </span>
            </div>

            <nav className="flex gap-1 bg-[#1A1D28] p-1.5 rounded-xl border border-[#232736]">
              {[
                { id: 'overview', label: 'Overview' },
                { id: 'trajectory', label: 'Slide 3 & 4: Path & Map' },
                { id: 'tutor', label: 'AI Tutor' },
                { id: 'sandbox', label: 'Sandbox' },
                { id: 'jobhunter', label: 'Job Hunter' },
                { id: 'cvstudio', label: 'CV Studio' },
                { id: 'linkedin', label: 'LinkedIn Audit' },
                { id: 'arena', label: 'AI Arena' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-3 py-1.5 rounded-lg text-[11px] font-bold uppercase tracking-wider transition-all ${
                    activeTab === tab.id 
                      ? 'bg-[#F59E0B] text-[#090A0F] shadow-lg font-extrabold' 
                      : 'text-[#94A3B8] hover:text-white'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </nav>

            <button 
              onClick={() => setShowIntake(!showIntake)}
              className="bg-[#232736] hover:bg-[#2D3346] border border-[#3B4256] text-[#F59E0B] text-xs font-bold px-4 py-2 rounded-xl transition-all"
            >
              {showIntake ? "Close Intake" : "Intake Slide"}
            </button>
          </header>

          {/* INTAKE OVERLAY SLIDE */}
          {showIntake && (
            <div className="bg-[#12141D] border-b border-[#232736] p-6 max-w-7xl mx-auto w-full">
              <h3 className="font-serif text-2xl text-white mb-4">Personalize Trajectory</h3>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label className="text-xs text-[#94A3B8] block mb-1">Full Name</label>
                  <input type="text" value={currentUser.name} onChange={e => setCurrentUser({...currentUser, name: e.target.value})} className="w-full bg-[#090A0F] border border-[#232736] rounded-xl p-2.5 text-xs text-white" />
                </div>
                <div>
                  <label className="text-xs text-[#94A3B8] block mb-1">City (e.g. Lahore, Karachi, Islamabad)</label>
                  <input type="text" value={currentUser.city} onChange={e => setCurrentUser({...currentUser, city: e.target.value})} className="w-full bg-[#090A0F] border border-[#232736] rounded-xl p-2.5 text-xs text-white" />
                </div>
                <div>
                  <label className="text-xs text-[#94A3B8] block mb-1">Target Role</label>
                  <input type="text" value={currentUser.targetRole} onChange={e => setCurrentUser({...currentUser, targetRole: e.target.value})} className="w-full bg-[#090A0F] border border-[#232736] rounded-xl p-2.5 text-xs text-white" />
                </div>
              </div>
              <button onClick={() => setShowIntake(false)} className="mt-4 w-full bg-[#F59E0B] text-[#090A0F] font-bold py-2.5 rounded-xl text-xs uppercase tracking-widest">Update Trajectory</button>
            </div>
          )}

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6">
            {activeTab === 'overview' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-r from-[#12141D] to-[#1A1D28] border border-[#232736] rounded-2xl p-8 text-center flex flex-col items-center shadow-2xl relative overflow-hidden">
                  <div className="absolute top-0 right-0 p-8 opacity-10 font-serif text-9xl text-[#F59E0B] pointer-events-none">APEX</div>
                  <span className="text-xs uppercase tracking-widest text-[#F59E0B] font-extrabold mb-2">Autonomous AI Career System</span>
                  <h1 className="font-serif text-4xl md:text-5xl text-white font-bold mb-3">Mastery Engine</h1>
                  <p className="text-xs text-[#94A3B8] max-w-xl italic mb-6">"Precision, dedication, and engineered practice define excellence."</p>
                  <div className="flex gap-4">
                    <button onClick={() => setActiveTab('trajectory')} className="bg-[#F59E0B] text-[#090A0F] px-6 py-3 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-[#D97706] shadow-lg">
                      Explore Slide 3 & 4 (Courses & Maps)
                    </button>
                    <button onClick={() => setActiveTab('arena')} className="bg-[#10B981] text-[#090A0F] px-6 py-3 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-[#059669] shadow-lg">
                      Launch Voice Interview Arena
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="bg-[#12141D] border border-[#232736] p-6 rounded-2xl glow-gold">
                    <span className="text-[10px] font-bold text-[#F59E0B] uppercase tracking-wider">Module 01</span>
                    <h3 className="font-serif text-xl text-white mt-1 mb-2">Deep Learning & AI Systems</h3>
                    <p className="text-xs text-[#94A3B8]">PyTorch, Neural Networks, Transformer Architectures & Model Fine-tuning.</p>
                  </div>
                  <div className="bg-[#12141D] border border-[#232736] p-6 rounded-2xl glow-emerald">
                    <span className="text-[10px] font-bold text-[#10B981] uppercase tracking-wider">Module 02</span>
                    <h3 className="font-serif text-xl text-white mt-1 mb-2">Full-Stack Application Stack</h3>
                    <p className="text-xs text-[#94A3B8]">React, Async Python APIs, Node.js, and Cloud Infrastructure.</p>
                  </div>
                  <div className="bg-[#12141D] border border-[#232736] p-6 rounded-2xl">
                    <span className="text-[10px] font-bold text-[#3B82F6] uppercase tracking-wider">Module 03</span>
                    <h3 className="font-serif text-xl text-white mt-1 mb-2">Industry Placement Studio</h3>
                    <p className="text-xs text-[#94A3B8]">Live mock interviews, automated LinkedIn audits, and tailored CVs.</p>
                  </div>
                </div>
              </div>
            )}

            {/* SLIDES 3 & 4: COURSE SUGGESTIONS & ACCURATE GOOGLE MAPS ACADEMIES */}
            {activeTab === 'trajectory' && (
              <div className="space-y-6">
                {/* SLIDE 3 */}
                <div className="bg-[#12141D] border border-[#232736] rounded-2xl p-6">
                  <span className="text-xs font-bold text-[#F59E0B] uppercase tracking-widest">Slide 3 Engine</span>
                  <h2 className="font-serif text-2xl text-white mt-1 mb-3">Custom Course Roadmap for {currentUser.name}</h2>
                  <p className="text-xs text-[#94A3B8] mb-4">Calculated based on target role: <strong className="text-white">{currentUser.targetRole}</strong></p>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bg-[#1A1D28] border border-[#232736] p-4 rounded-xl">
                      <h4 className="text-xs font-bold text-[#10B981] uppercase">Track A: Advanced AI Engineering</h4>
                      <p className="text-xs text-[#E2E8F0] mt-1">Deep Learning, Machine Learning Models, Model Deployment & API integrations.</p>
                      <div className="mt-3 flex justify-between text-[11px] text-[#94A3B8] border-t border-[#232736] pt-2">
                        <span>Duration: 16 Weeks</span>
                        <span className="text-[#F59E0B] font-bold">Estimated Level: Advanced</span>
                      </div>
                    </div>

                    <div className="bg-[#1A1D28] border border-[#232736] p-4 rounded-xl">
                      <h4 className="text-xs font-bold text-[#3B82F6] uppercase">Track B: Full-Stack Web Systems</h4>
                      <p className="text-xs text-[#E2E8F0] mt-1">Modern React, State Management, Scalable Backend Services, and SQL Databases.</p>
                      <div className="mt-3 flex justify-between text-[11px] text-[#94A3B8] border-t border-[#232736] pt-2">
                        <span>Duration: 12 Weeks</span>
                        <span className="text-[#F59E0B] font-bold">Estimated Level: Intermediate</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* SLIDE 4 */}
                <div className="bg-[#12141D] border border-[#232736] rounded-2xl p-6">
                  <span className="text-xs font-bold text-[#10B981] uppercase tracking-widest">Slide 4 Local Institute Locator</span>
                  <h2 className="font-serif text-2xl text-white mt-1 mb-2">Verified Academies & Institutes in {currentUser.city}</h2>
                  <p className="text-xs text-[#94A3B8] mb-4">Direct location markers and Google Maps links for physical on-site learning.</p>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {cityAcademies.map((ac, i) => (
                      <div key={i} className="bg-[#1A1D28] border border-[#232736] p-4 rounded-xl space-y-2 flex flex-col justify-between">
                        <div>
                          <h4 className="text-xs font-bold text-white">{ac.name}</h4>
                          <p className="text-[11px] text-[#10B981] font-semibold">{ac.course}</p>
                          <p className="text-[11px] text-[#94A3B8] mt-1">{ac.location}</p>
                          <p className="text-[11px] text-[#E2E8F0] mt-1">Phone: {ac.phone}</p>
                        </div>
                        <a 
                          href={ac.mapUrl} 
                          target="_blank" 
                          rel="noopener noreferrer"
                          className="mt-3 inline-block text-center bg-[#232736] hover:bg-[#F59E0B] hover:text-[#090A0F] text-[#F59E0B] border border-[#3B4256] py-2 rounded-lg text-[11px] font-bold uppercase transition-all"
                        >
                          Open Google Maps Location 📍
                        </a>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'tutor' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="md:col-span-2 bg-[#12141D] border border-[#232736] rounded-2xl flex flex-col h-[540px]">
                  <div className="border-b border-[#232736] p-4 bg-[#1A1D28] flex justify-between items-center">
                    <span className="font-serif text-lg text-white">AI Technical Tutor</span>
                    <span className="text-[10px] text-[#10B981] bg-[#10B981]/10 px-2 py-0.5 rounded-full font-bold">Voice Synthesis Active</span>
                  </div>
                  <div className="flex-1 p-5 overflow-y-auto space-y-4">
                    {tutorMessages.map((msg, idx) => (
                      <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[80%] p-3.5 rounded-2xl text-xs leading-relaxed ${msg.sender === 'user' ? 'bg-[#F59E0B] text-[#090A0F] font-bold' : 'bg-[#1A1D28] border border-[#232736] text-[#E2E8F0]'}`}>
                          {msg.text}
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="p-4 border-t border-[#232736] flex gap-2">
                    <input type="text" value={tutorInput} onChange={e => setTutorInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleTutorSend()} placeholder="Ask a technical question regarding Python, ML, DL, or Full-Stack..." className="flex-1 bg-[#090A0F] border border-[#232736] rounded-xl px-4 py-2.5 text-xs text-white outline-none" />
                    <button onClick={handleTutorSend} className="bg-[#F59E0B] text-[#090A0F] px-5 py-2.5 rounded-xl text-xs font-extrabold uppercase">Send</button>
                  </div>
                </div>

                <div className="bg-[#12141D] border border-[#232736] rounded-2xl p-5 flex flex-col gap-4">
                  <div>
                    <h3 className="font-serif text-lg text-white">YouTube Video Processor</h3>
                    <p className="text-xs text-[#94A3B8] mt-1">Convert YouTube technical tutorials into live structured notes.</p>
                  </div>
                  <input type="text" value={ytUrl} onChange={e => setYtUrl(e.target.value)} placeholder="Paste YouTube Video Link..." className="bg-[#090A0F] border border-[#232736] rounded-xl p-2.5 text-xs text-white outline-none" />
                  <button onClick={handleYtConvert} className="bg-[#232736] border border-[#3B4256] text-[#F59E0B] py-2.5 rounded-xl text-xs font-bold uppercase hover:bg-[#2D3346]">Process & Generate Notes</button>

                  {ytSummary && (
                    <div className="bg-[#1A1D28] border border-[#232736] p-4 rounded-xl space-y-2 mt-2">
                      <h4 className="text-xs font-bold text-[#F59E0B]">{ytSummary.title}</h4>
                      {ytSummary.keyPoints.map((pt, i) => (
                        <p key={i} className="text-[11px] text-[#94A3B8]">{pt}</p>
                      ))}
                      <p className="text-[10px] text-[#10B981] italic mt-2">{ytSummary.translation}</p>
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'sandbox' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 h-[540px]">
                <div className="bg-[#12141D] border border-[#232736] rounded-2xl flex flex-col overflow-hidden">
                  <div className="p-4 border-b border-[#232736] bg-[#1A1D28] flex justify-between items-center">
                    <span className="text-xs font-bold uppercase tracking-wider text-white">JavaScript Code Sandbox</span>
                    <button onClick={runSandboxCode} className="bg-[#10B981] text-[#090A0F] px-4 py-1.5 rounded-lg text-xs font-bold uppercase">Execute Code</button>
                  </div>
                  <textarea value={sandboxCode} onChange={e => setSandboxCode(e.target.value)} className="flex-1 bg-[#090A0F] p-4 font-mono text-xs text-[#F59E0B] outline-none resize-none leading-relaxed" />
                </div>
                <div className="bg-[#12141D] border border-[#232736] rounded-2xl flex flex-col overflow-hidden">
                  <div className="p-4 border-b border-[#232736] bg-[#1A1D28]"><span className="text-xs font-bold uppercase tracking-wider text-white">Execution Console Output</span></div>
                  <pre className="flex-1 bg-[#090A0F] p-4 font-mono text-xs text-[#10B981] overflow-auto whitespace-pre-wrap">{sandboxOutput || "// Click 'Execute Code' to run script..."}</pre>
                </div>
              </div>
            )}

            {activeTab === 'jobhunter' && (
              <div className="bg-[#12141D] border border-[#232736] rounded-2xl p-6 space-y-6">
                <div>
                  <h2 className="font-serif text-2xl text-white">Industry Vacancies & Direct Contact Contacts</h2>
                  <p className="text-xs text-[#94A3B8] mt-1">Verified vacancies including direct recruiter emails, phone numbers, and technical requirement breakdowns.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-[#1A1D28] border border-[#232736] p-5 rounded-xl space-y-2">
                    <span className="text-xs font-bold text-[#F59E0B]">Emirates Tech Group</span>
                    <h4 className="text-sm font-bold text-white">Software Engineer / AI Integrator</h4>
                    <p className="text-[11px] text-[#94A3B8]">Requirements: Python, REST APIs, React, 1+ yrs project experience.</p>
                    <p className="text-[11px] text-[#10B981] font-bold">Salary: AED 14,000 - 18,000 / month</p>
                    <div className="border-t border-[#232736] pt-2 text-[11px]">
                      <p className="text-white">Email: <span className="text-[#F59E0B]">careers@emirates.com</span></p>
                      <p className="text-white">Phone: +971 4 703 1111</p>
                    </div>
                  </div>

                  <div className="bg-[#1A1D28] border border-[#232736] p-5 rounded-xl space-y-2">
                    <span className="text-xs font-bold text-[#F59E0B]">Systems Limited (Lahore Office)</span>
                    <h4 className="text-sm font-bold text-white">Junior Full-Stack Python Developer</h4>
                    <p className="text-[11px] text-[#94A3B8]">Requirements: Django/FastAPI, JavaScript, SQL, Problem Solving.</p>
                    <p className="text-[11px] text-[#10B981] font-bold">Salary: PKR 120,000 - 180,000 / month</p>
                    <div className="border-t border-[#232736] pt-2 text-[11px]">
                      <p className="text-white">Email: <span className="text-[#F59E0B]">hr@systemsltd.com</span></p>
                      <p className="text-white">Phone: +92 42 111 797 836</p>
                    </div>
                  </div>

                  <div className="bg-[#1A1D28] border border-[#232736] p-5 rounded-xl space-y-2">
                    <span className="text-xs font-bold text-[#F59E0B]">Contour Software (Remote/PK)</span>
                    <h4 className="text-sm font-bold text-white">Associate Data & AI Scientist</h4>
                    <p className="text-[11px] text-[#94A3B8]">Requirements: Python, PyTorch, Model Evaluation, Data Cleaning.</p>
                    <p className="text-[11px] text-[#10B981] font-bold">Salary: PKR 150,000 - 220,000 / month</p>
                    <div className="border-t border-[#232736] pt-2 text-[11px]">
                      <p className="text-white">Email: <span className="text-[#F59E0B]">recruitment@contour-software.com</span></p>
                      <p className="text-white">Phone: +92 21 3432 2201</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'cvstudio' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-[#12141D] border border-[#232736] rounded-2xl p-5 space-y-3">
                  <h3 className="font-serif text-lg text-white">CV Controls Intake</h3>
                  <input type="text" placeholder="Full Name" value={cvData.fullName} onChange={e => setCvData({...cvData, fullName: e.target.value})} className="w-full bg-[#090A0F] border border-[#232736] rounded-xl p-2 text-xs text-white" />
                  <input type="email" placeholder="Email Address" value={cvData.email} onChange={e => setCvData({...cvData, email: e.target.value})} className="w-full bg-[#090A0F] border border-[#232736] rounded-xl p-2 text-xs text-white" />
                  <input type="text" placeholder="Phone Number" value={cvData.phone} onChange={e => setCvData({...cvData, phone: e.target.value})} className="w-full bg-[#090A0F] border border-[#232736] rounded-xl p-2 text-xs text-white" />
                  <div className="flex gap-2">
                    <input type="text" placeholder="City" value={cvData.city} onChange={e => setCvData({...cvData, city: e.target.value})} className="w-1/2 bg-[#090A0F] border border-[#232736] rounded-xl p-2 text-xs text-white" />
                    <input type="text" placeholder="Country" value={cvData.country} onChange={e => setCvData({...cvData, country: e.target.value})} className="w-1/2 bg-[#090A0F] border border-[#232736] rounded-xl p-2 text-xs text-white" />
                  </div>
                  <input type="text" placeholder="Target Job Title" value={cvData.title} onChange={e => setCvData({...cvData, title: e.target.value})} className="w-full bg-[#090A0F] border border-[#232736] rounded-xl p-2 text-xs text-white" />
                  <textarea placeholder="Detailed Work Experience" value={cvData.experience} onChange={e => setCvData({...cvData, experience: e.target.value})} className="w-full bg-[#090A0F] border border-[#232736] rounded-xl p-2 text-xs text-white h-16 resize-none" />
                  <textarea placeholder="Key Projects" value={cvData.projects} onChange={e => setCvData({...cvData, projects: e.target.value})} className="w-full bg-[#090A0F] border border-[#232736] rounded-xl p-2 text-xs text-white h-16 resize-none" />
                  <input type="text" placeholder="Technical Skills" value={cvData.skills} onChange={e => setCvData({...cvData, skills: e.target.value})} className="w-full bg-[#090A0F] border border-[#232736] rounded-xl p-2 text-xs text-white" />
                </div>

                <div className="md:col-span-2 space-y-4 overflow-y-auto max-h-[560px] pr-2">
                  <span className="text-xs font-bold uppercase tracking-widest text-[#F59E0B]">5 Tailored Professional CV Samples</span>

                  {/* SAMPLE 1 */}
                  <div className="bg-white text-slate-900 p-6 rounded-xl border-l-4 border-[#F59E0B] shadow-md">
                    <span className="text-[10px] font-bold uppercase text-slate-400">Sample 1: Executive Modern</span>
                    <h3 className="font-serif text-2xl font-bold">{cvData.fullName}</h3>
                    <p className="text-xs text-[#D97706] font-bold">{cvData.title} • {cvData.city}, {cvData.country}</p>
                    <p className="text-[11px] text-slate-600">{cvData.email} | {cvData.phone}</p>
                    <div className="mt-3 text-xs border-t border-slate-200 pt-2">
                      <p><strong>Experience:</strong> {cvData.experience}</p>
                      <p className="mt-1"><strong>Key Projects:</strong> {cvData.projects}</p>
                    </div>
                  </div>

                  {/* SAMPLE 2 */}
                  <div className="bg-slate-900 border border-slate-700 text-white p-6 rounded-xl shadow-md">
                    <span className="text-[10px] font-bold uppercase text-slate-500">Sample 2: Tech Dark Minimal</span>
                    <h3 className="font-sans text-2xl font-bold text-[#F59E0B]">{cvData.fullName}</h3>
                    <p className="text-xs text-slate-300">{cvData.title} | {cvData.email}</p>
                    <p className="text-xs text-slate-400 mt-2"><strong>Core Stack:</strong> {cvData.skills}</p>
                    <p className="text-xs text-slate-300 mt-2"><strong>Projects:</strong> {cvData.projects}</p>
                  </div>

                  {/* SAMPLE 3 */}
                  <div className="bg-amber-50 text-slate-900 p-6 rounded-xl border border-amber-200 shadow-md">
                    <span className="text-[10px] font-bold uppercase text-amber-700">Sample 3: Editorial Column</span>
                    <h3 className="font-serif text-2xl font-bold">{cvData.fullName}</h3>
                    <p className="text-xs text-amber-800 font-semibold">{cvData.title}</p>
                    <p className="text-xs text-slate-700 mt-2">{cvData.experience}</p>
                  </div>

                  {/* SAMPLE 4 */}
                  <div className="bg-white text-slate-900 p-6 rounded-xl border border-slate-300 shadow-md">
                    <span className="text-[10px] font-bold uppercase text-slate-400">Sample 4: Corporate Clean</span>
                    <h3 className="text-xl font-bold text-slate-800 uppercase">{cvData.fullName}</h3>
                    <p className="text-xs text-slate-600">{cvData.title} • {cvData.phone} • {cvData.city}</p>
                    <p className="text-xs text-slate-700 mt-2"><strong>Competencies:</strong> {cvData.skills}</p>
                  </div>

                  {/* SAMPLE 5 */}
                  <div className="bg-slate-800 text-slate-100 p-6 rounded-xl border-t-2 border-[#10B981] shadow-md">
                    <span className="text-[10px] font-bold uppercase text-[#10B981]">Sample 5: Compact Grid</span>
                    <h3 className="text-xl font-bold">{cvData.fullName}</h3>
                    <p className="text-xs text-slate-300">{cvData.city}, {cvData.country} | {cvData.email}</p>
                    <p className="text-xs text-slate-300 mt-2"><strong>Projects & Experience:</strong> {cvData.projects}</p>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'linkedin' && (
              <div className="bg-[#12141D] border border-[#232736] rounded-2xl p-6 space-y-6">
                <div>
                  <h2 className="font-serif text-2xl text-white">LinkedIn Audit Engine</h2>
                  <p className="text-xs text-[#94A3B8] mt-1">Audit your LinkedIn profile against industry keywords and recruiter search algorithms.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <input type="text" value={linkedinUrl} onChange={e => setLinkedinUrl(e.target.value)} placeholder="https://linkedin.com/in/username" className="bg-[#090A0F] border border-[#232736] rounded-xl p-3 text-xs text-white outline-none" />
                  <button onClick={runLinkedinAudit} className="bg-[#F59E0B] text-[#090A0F] py-3 rounded-xl text-xs font-bold uppercase hover:bg-[#D97706]">Run Profile Audit</button>
                </div>

                <textarea value={linkedinText} onChange={e => setLinkedinText(e.target.value)} placeholder="Or paste raw headline and summary text..." className="w-full bg-[#090A0F] border border-[#232736] rounded-xl p-3 text-xs text-white h-24 outline-none resize-none" />

                {linkedinResult && (
                  <div className="bg-[#1A1D28] border border-[#232736] rounded-xl p-5 space-y-4">
                    <div className="flex items-center justify-between border-b border-[#232736] pb-4">
                      <div>
                        <span className="text-xs font-bold text-[#F59E0B] uppercase">Optimization Score</span>
                        <h3 className="text-3xl font-bold text-white mt-1">{linkedinResult.score} / 100</h3>
                      </div>
                      <div className="text-right">
                        <p className="text-xs text-[#94A3B8]">Headline Score: <strong className="text-white">{linkedinResult.headlineRating}</strong></p>
                      </div>
                    </div>

                    <div>
                      <h4 className="text-xs font-bold text-white uppercase mb-2">Recommended Action Steps</h4>
                      <ul className="space-y-1.5">
                        {linkedinResult.actionSteps.map((act, i) => (
                          <li key={i} className="text-xs text-[#94A3B8] flex items-center gap-2">
                            <span className="text-[#10B981] font-bold">✓</span> {act}
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'arena' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 h-[540px]">
                <div className="bg-[#12141D] border border-[#232736] rounded-2xl p-5 flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between items-center mb-2">
                      <h3 className="font-serif text-lg text-white">Live AI Interview Arena</h3>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${isListening ? 'bg-red-500/20 text-red-400 animate-pulse' : 'bg-[#232736] text-[#94A3B8]'}`}>
                        {isListening ? "Listening (Mic Active)..." : "Mic Standby"}
                      </span>
                    </div>

                    <div className="relative aspect-video bg-[#090A0F] rounded-xl overflow-hidden border border-[#232736] flex items-center justify-center">
                      <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
                      {!cameraActive && <span className="text-xs text-[#94A3B8] absolute">Camera Stream Offline</span>}
                    </div>

                    {/* LIVE MIC TRANSCRIPT */}
                    <div className="mt-3 bg-[#090A0F] border border-[#232736] rounded-xl p-3 h-16 overflow-y-auto">
                      <span className="text-[10px] text-[#F59E0B] font-bold uppercase block">Live Voice Transcript:</span>
                      <p className="text-xs text-white">{userTranscript || "Speak into your microphone..."}</p>
                    </div>
                  </div>

                  <div className="flex gap-2 mt-2">
                    <button onClick={startCamera} className="flex-1 bg-[#232736] text-white py-2.5 rounded-xl text-xs font-semibold hover:bg-[#2D3346]">1. Camera & Audio</button>
                    <button onClick={startInterview} disabled={!cameraActive} className="flex-1 bg-[#10B981] text-[#090A0F] py-2.5 rounded-xl text-xs font-bold uppercase disabled:opacity-40">2. Start AI Interview</button>
                    <button onClick={toggleListening} disabled={!interviewStarted} className={`px-4 rounded-xl text-xs font-bold uppercase ${isListening ? 'bg-red-500 text-white' : 'bg-[#F59E0B] text-[#090A0F]'}`}>
                      {isListening ? "Stop Mic" : "Mic On 🎙️"}
                    </button>
                  </div>
                </div>

                <div className="bg-[#12141D] border border-[#232736] rounded-2xl p-5 flex flex-col justify-between">
                  <div>
                    <h3 className="font-serif text-lg text-white mb-3">AI Technical Recruiter Response</h3>
                    <div className="bg-[#1A1D28] border border-[#232736] rounded-xl p-4 text-xs text-[#E2E8F0] leading-relaxed min-h-[220px] whitespace-pre-wrap">
                      {interviewFeedback}
                    </div>
                  </div>

                  {interviewStarted && (
                    <button onClick={submitVoiceAnswer} className="w-full bg-[#F59E0B] text-[#090A0F] py-3 rounded-xl text-xs font-extrabold uppercase tracking-widest hover:bg-[#D97706]">
                      Submit Voice Answer for Evaluation
                    </button>
                  )}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AICareerCompass />);
  </script>
</body>
</html>
